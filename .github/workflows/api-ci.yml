name: API CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build API
        run: dotnet build GymLeagueAPI/GymLeagueAPI/GymLeagueAPI.csproj -c Release

      - name: Run API unit tests
        run: dotnet test GymLeagueAPI/GymLeagueAPI.Tests/GymLeagueAPI.Tests.csproj -c Release --logger "trx;LogFileName=api-tests.trx"

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: GymLeagueAPI/GymLeagueAPI.Tests/TestResults/
